application:
  title: Gotenberg
  subtitle: 文档转换 API（Office/HTML 转 PDF、截图）
  subdomain: gotenberg
  multi_instance: false
  upstreams:
    - location: /
      backend: http://gotenberg:3000/
  ingress:
    - protocol: tcp
      port: 3000
      service: gotenberg
services:
  gotenberg:
    # upstream: gotenberg/gotenberg:9.1.0
    image: docker.1ms.run/gotenberg/gotenberg:9.1.0
    environment:
      - TZ=Asia/Shanghai
usage: "Gotenberg 是一个无状态的文档转换 API：把 HTML、Markdown、\nOffice 文档（docx/xlsx/pptx 等）转成 PDF、图片，或互相转换，\n内置 Chromium 与 LibreOffice，常与自动化流程/脚本搭配使用。\n\n使用方法（无 Web 界面，纯 HTTP API）：\n1. 打开应用入口，请求经平台入口鉴权后转发到本服务。\n2. 例：把 docx 转 PDF（form-data）：\n   curl -X POST https://<你的应用地址>/forms/libreoffice/convert ' \n     -F files=@文档.docx -o 文档.pdf\n3. 例：网页截图：\n   curl -X POST https://<你的应用地址>/forms/chromium/screenshot/url ' \n     -F url=https://example.com -o screenshot.png\n4. 完整端点与参数见 https://gotenberg.dev/docs。\n\n安全说明：\n- Gotenberg 自身不带账号体系（官方无鉴权设计），因此不使用\n  public_path，统一由平台入口鉴权挡在前面；请勿把该地址透露给\n  平台外的其他人。\n- 服务无状态：转换在内存/临时目录完成，自动清理，无外部数据库。\n\n说明：\n- 未做实机验证：文档转换、截图、并发与超时行为均未在设备上实测。\n"
